# When a check fails on a Dependabot pull request, Codex fixes the code and a new
# pull request is opened with Dependabot's bump and the fix. A maintainer approves
# or closes that pull request. Dependabot's own pull request is left alone and
# closes by itself when the fix is merged.
name: Fix Dependabot CI

on:
  workflow_run:
    workflows: [pyright, ruff, pytest]
    types: [completed]

permissions: {}

# One fix at a time for a branch. The conclusion is part of the group so that the
# runs that only skip (a check passed) cannot push a waiting fix out of the queue.
concurrency:
  group: fix-dependabot-ci-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: false

env:
  FIX_BRANCH: fix/${{ github.event.workflow_run.head_branch }}
  # The versions in the matrices of the pyright, ruff and pytest workflows.
  PYTHON_VERSIONS: "3.10 3.11 3.12 3.13 3.14"

jobs:
  # Installs and runs the updated dependencies. No secrets and no write access.
  reproduce:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      failed: ${{ steps.checks.outputs.failed }}
    steps:
      - name: Skip when a fix is already open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$FIX_BRANCH" --state open --json number --jq length)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check out Dependabot's commit
        if: steps.open.outputs.count == '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install uv
        if: steps.open.outputs.count == '0'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Run the checks on every Python version
        if: steps.open.outputs.count == '0'
        id: checks
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          failed=false
          for version in $PYTHON_VERSIONS; do
            export UV_PYTHON="$version"
            log="$RUNNER_TEMP/checks/checks-$version.log"
            for command in "sync --locked" "run --no-sync pyright" "run --no-sync ruff check ." \
              "run --no-sync ruff format --check ." "run --no-sync pytest"; do
              echo "$ uv $command" >> "$log"
              uv $command >> "$log" 2>&1 || { echo "exit code $?" >> "$log"; failed=true; }
              echo >> "$log"
            done
            echo "::group::Python $version"
            cat "$log"
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Upload the output of the checks
        if: steps.checks.outputs.failed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: checks
          path: ${{ runner.temp }}/checks
          retention-days: 1

  # Runs Codex, on a runner that has not run anything from the update before the
  # OpenAI key arrives. No write access to the repository.
  fix:
    needs: reproduce
    if: needs.reproduce.outputs.failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.patch.outputs.patch }}
    steps:
      - name: Check out Dependabot's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Download the output of the checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: checks
          path: .codex-ci

      # Codex runs without network access, so it gets one environment per Python
      # version. Only wheels are unpacked here: nothing is built and the project is
      # not installed, so no code from the update runs before Codex does. An update
      # that needs a source build stops the job at this step.
      - name: Install the dependencies without running them
        run: |
          for version in $PYTHON_VERSIONS; do
            UV_PROJECT_ENVIRONMENT=".codex-ci/venv-$version" \
              uv sync --locked --no-build --no-install-project --python "$version"
          done
          # pyright asks the interpreter for its search paths with a call that fails
          # in Codex's sandbox, so the script tells it where the environment is. This
          # repository has no pyright settings of its own. If it gets some, they
          # belong in the file written below as well.
          cat > .codex-ci/check <<'EOF'
          #!/bin/sh
          # Runs the four checks on one Python version, for example: .codex-ci/check 3.10
          bin=".codex-ci/venv-$1/bin"
          printf '{"venvPath": ".codex-ci", "venv": "venv-%s", "pythonVersion": "%s"}\n' "$1" "$1" \
            > ".codex-ci-pyright-$1.json"
          status=0
          "$bin/pyright" --project ".codex-ci-pyright-$1.json" || status=1
          "$bin/ruff" check . || status=1
          "$bin/ruff" format --check . || status=1
          "$bin/pytest" || status=1
          exit $status
          EOF
          chmod +x .codex-ci/check

      - name: Run Codex
        uses: openai/codex-action@54e817e77767f274e7e9ceb9da755fb5c62ce25d # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # The run's actor is dependabot[bot], which has no write access of its own.
          allow-bot-users: dependabot
          permission-profile: ":workspace"
          prompt: |
            A Dependabot update made CI fail in this Python repository. CI runs
            four checks on Python 3.10 to 3.14. Their output from before any fix
            is in `.codex-ci/checks-<version>.log`. Find the root cause of every
            failure and make the smallest correct change to the source or the
            tests that makes all four checks pass on every version.

            `.codex-ci/check <version>` runs the four checks on one version, for
            example `.codex-ci/check 3.10`. Run it for every version before you
            finish. There is no network access.

            Keep the dependency update as it is. Do not edit anything under
            `.github` or `.codex-ci`. Do not commit or push. Do not make
            unrelated changes.

      - name: Save the fix as a patch
        id: patch
        run: |
          git add --all -- . ':(exclude).github' ':(exclude).codex-ci*'
          git diff --cached --binary > "$RUNNER_TEMP/fix.patch"
          if [ -s "$RUNNER_TEMP/fix.patch" ]; then echo "patch=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the patch
        if: steps.patch.outputs.patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: fix
          path: ${{ runner.temp }}/fix.patch
          retention-days: 1

  # Opens the pull request. Runs no code from the pull request.
  open-pull-request:
    needs: fix
    if: needs.fix.outputs.patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: fix
          path: ${{ runner.temp }}

      - name: Apply Dependabot's bump, then the fix
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_SHA"
          # -s: the commit is created again under this bot's name, and the DCO check
          # wants the sign-off of whoever the author is.
          git cherry-pick -s "$(git merge-base HEAD "$HEAD_SHA")..$HEAD_SHA"
          git apply --index "$RUNNER_TEMP/fix.patch"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: ${{ env.FIX_BRANCH }}
          sign-commits: true
          signoff: true
          commit-message: "fix: make CI pass with ${{ github.event.workflow_run.head_branch }}"
          title: "fix: make CI pass with ${{ github.event.workflow_run.head_branch }}"
          body: |
            Checks failed on Dependabot's pull request #${{ github.event.workflow_run.pull_requests[0].number }}.
            This pull request has Dependabot's update and a fix written by Codex.
            Once it is merged the update is on main, and Dependabot closes its own pull request.
