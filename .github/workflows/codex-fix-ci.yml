name: Codex fix CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - .github/actions/**
      - .github/workflows/**
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to fix
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-fix-ci-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  generate-patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/codex fix-ci'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            actor_permission="$(gh api \
              "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
              --jq '.permission')"
            case "$actor_permission" in
              admin|maintain|write) ;;
              *)
                echo "@$GITHUB_ACTOR does not have permission to run Codex." >&2
                exit 1
                ;;
            esac
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"

          if [ "$(jq -r '.state' <<< "$pr_json")" != "open" ]; then
            echo "Pull request #$PR_NUMBER is not open." >&2
            exit 1
          fi

          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "Refusing to update a branch in fork $head_repository." >&2
            exit 1
          fi

          echo "head_sha=$(jq -r '.head.sha' <<< "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Capture current check results
        id: checks
        run: |
          mkdir -p .codex-ci
          set +e
          has_failures=false

          uv sync --locked > .codex-ci/uv-sync.log 2>&1
          status=$?
          echo "$status" > .codex-ci/uv-sync.exit-code
          if [ "$status" -ne 0 ]; then has_failures=true; fi

          uv run --no-sync pyright > .codex-ci/pyright.log 2>&1
          status=$?
          echo "$status" > .codex-ci/pyright.exit-code
          if [ "$status" -ne 0 ]; then has_failures=true; fi

          uv run --no-sync ruff check . > .codex-ci/ruff-check.log 2>&1
          status=$?
          echo "$status" > .codex-ci/ruff-check.exit-code
          if [ "$status" -ne 0 ]; then has_failures=true; fi

          uv run --no-sync ruff format --check . > .codex-ci/ruff-format.log 2>&1
          status=$?
          echo "$status" > .codex-ci/ruff-format.exit-code
          if [ "$status" -ne 0 ]; then has_failures=true; fi

          uv run --no-sync pytest > .codex-ci/pytest.log 2>&1
          status=$?
          echo "$status" > .codex-ci/pytest.exit-code
          if [ "$status" -ne 0 ]; then has_failures=true; fi

          echo "has_failures=$has_failures" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        if: github.event_name != 'pull_request' || steps.checks.outputs.has_failures == 'true'
        id: codex
        uses: openai/codex-action@54e817e77767f274e7e9ceb9da755fb5c62ce25d # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: dependabot
          permission-profile: ":workspace"
          prompt: |
            Fix the CI failures for pull request #${{ env.PR_NUMBER }} in this Python repository.

            The current check output is in `.codex-ci`. Inspect every
            `*.log` file and its matching `*.exit-code` file. Reproduce failures when
            useful, determine their root cause, and make the smallest correct source or
            test change that gets all checks passing. Run these commands before finishing:

              uv run pyright
              uv run ruff check .
              uv run ruff format --check .
              uv run pytest

            Preserve the intent of the pull request. Do not update dependencies, edit
            files under `.github/workflows`, or edit agent configuration. Do not commit
            or push. Do not make unrelated refactors.

      - name: Create patch
        if: github.event_name != 'pull_request' || steps.checks.outputs.has_failures == 'true'
        run: |
          set -euo pipefail
          git add --intent-to-add --all
          git reset -- .github/workflows .agents .codex AGENTS.md 2>/dev/null || true
          git diff --binary -- . \
            ':(exclude).codex-ci/**' \
            ':(exclude).github/workflows/**' \
            ':(exclude).agents/**' \
            ':(exclude).codex/**' \
            ':(exclude)AGENTS.md' > "$RUNNER_TEMP/codex.patch"

          if [ ! -s "$RUNNER_TEMP/codex.patch" ]; then
            echo "Codex did not produce an eligible patch." >&2
            exit 1
          fi

          printf '%s\n' '${{ steps.pr.outputs.head_sha }}' > "$RUNNER_TEMP/head-sha"

      - name: Upload patch
        if: github.event_name != 'pull_request' || steps.checks.outputs.has_failures == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: codex-fix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex.patch
            ${{ runner.temp }}/head-sha
          if-no-files-found: error
          retention-days: 1

  publish-patch:
    if: github.event_name != 'pull_request'
    needs: generate-patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr_json")"

          if [ "$(jq -r '.state' <<< "$pr_json")" != "open" ]; then
            echo "Pull request #$PR_NUMBER is not open." >&2
            exit 1
          fi

          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "Refusing to update a branch in fork $head_repository." >&2
            exit 1
          fi

          echo "head_ref=$(jq -r '.head.ref' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<< "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: codex-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-fix

      - name: Validate and apply patch
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          patch_dir="$RUNNER_TEMP/codex-fix"

          if [ "$(cat "$patch_dir/head-sha")" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The pull request changed while Codex was working. Run the command again." >&2
            exit 1
          fi

          git apply --check "$patch_dir/codex.patch"
          git apply "$patch_dir/codex.patch"
          git add --all

          mapfile -t changed_files < <(git diff --cached --name-only)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "The patch contains no changes." >&2
            exit 1
          fi

          if [ "${#changed_files[@]}" -gt 20 ]; then
            echo "Refusing a patch that changes more than 20 files." >&2
            exit 1
          fi

          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/workflows/*|.github/actions/*|.agents/*|.codex/*|AGENTS.md)
                echo "Refusing protected path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Create verified commit and update branch
        id: publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headRef = process.env.HEAD_REF;
            const headSha = process.env.EXPECTED_HEAD_SHA;
            const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();

            if (git("rev-parse", "HEAD") !== headSha) {
              throw new Error("The checked-out commit does not match the expected PR head.");
            }

            const changed = execFileSync(
              "git",
              ["diff", "--cached", "--name-only", "-z", "--no-renames"],
            ).toString("utf8").split("\0").filter(Boolean);
            const treeEntries = [];

            for (const path of changed) {
              if (fs.existsSync(path) || fs.lstatSync(path, { throwIfNoEntry: false })) {
                const indexEntry = execFileSync("git", ["ls-files", "--stage", "-z", "--", path])
                  .toString("utf8");
                const match = indexEntry.match(/^([0-7]{6}) ([0-9a-f]+) 0\t/);
                if (!match) throw new Error(`Unable to read index metadata for ${path}`);

                const mode = match[1];
                if (mode === "160000") {
                  treeEntries.push({ path, mode, type: "commit", sha: match[2] });
                  continue;
                }

                const content = mode === "120000"
                  ? Buffer.from(fs.readlinkSync(path), "utf8")
                  : fs.readFileSync(path);
                const blob = await github.rest.git.createBlob({
                  owner,
                  repo,
                  content: content.toString("base64"),
                  encoding: "base64",
                });
                treeEntries.push({ path, mode, type: "blob", sha: blob.data.sha });
              } else {
                const oldEntry = execFileSync("git", ["ls-tree", "-z", "HEAD", "--", path])
                  .toString("utf8");
                const match = oldEntry.match(/^([0-7]{6}) (blob|tree|commit) [0-9a-f]+\t/);
                if (!match) throw new Error(`Unable to read base metadata for deleted path ${path}`);
                treeEntries.push({ path, mode: match[1], type: match[2], sha: null });
              }
            }

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: git("rev-parse", "HEAD^{tree}"),
              tree: treeEntries,
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "fix: address CI failures with Codex\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>",
              tree: tree.data.sha,
              parents: [headSha],
            });

            if (!commit.data.verification?.verified) {
              throw new Error(`GitHub did not verify the bot signature: ${commit.data.verification?.reason ?? "unknown"}`);
            }

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${headRef}`,
              sha: commit.data.sha,
              force: false,
            });
            core.setOutput("commit_sha", commit.data.sha);

      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "Codex generated and pushed signed commit \`${COMMIT_SHA:0:7}\` to address the CI failures."
